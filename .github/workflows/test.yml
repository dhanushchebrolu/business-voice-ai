name: Test

# Minimal, test-only CI. This workflow never builds a deployable artifact for
# Cloudflare and never deploys anything — Cloudflare Workers Builds (see
# DEPLOYMENT.md) remains the only thing that deploys this app, completely
# independent of this file. `vite build` below is run only as a smoke check
# that the bundle still compiles, with throwaway, non-secret placeholder
# values for the two VITE_* build-time vars it requires.
#
# No repository-managed test workflow existed before this file (confirmed:
# no .github/workflows directory at all) — the only prior automation was
# Cloudflare Workers Builds running `vite build` on push, which never ran any
# test. This is the smallest workflow that actually runs the project's real
# PostgreSQL-backed regression tests, not just a source-text scan of them,
# and treats an unexpected skip of those tests as a hard CI failure rather
# than a silent pass.
#
# Every push runs it, main included: Lovable pushes straight to main, so a
# main-only change (one that never went through a pull request) is still
# tested. Running it never deploys anything (see above).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install voice agent dependencies
        # src/lib/voice-agent/voice-agent-api.test.ts drives the LiveKit
        # agent's real client and tools against klyro's handlers, so the root
        # typecheck and test suite load services/voice-agent code, which needs
        # @livekit/agents. That package is its own npm project with its own
        # lockfile (as in voice-agent.yml); install it exactly from that.
        working-directory: services/voice-agent
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL server
        # The disposable-cluster regression tests (supabase/migrations/*.pg.test.ts)
        # run their own initdb/pg_ctl-managed cluster — they need the server
        # binaries on PATH, not a separately running Postgres service container.
        #
        # GitHub's ubuntu-26.04 image already ships the PostgreSQL 18 server in
        # /usr/lib/postgresql/18/bin, which is where pg-test-cluster.ts looks;
        # apt only ever added the 18.6 kB `postgresql` meta-package. Run
        # 44521771352 failed (exit 100) fetching that package while Ubuntu's
        # mirrors returned 503 / timed out, before any of our checks ran. So
        # install only when no server is present, with apt retries. Nothing is
        # weakened: the next step still fails if any PostgreSQL test skips.
        run: |
          set -eo pipefail
          if compgen -G "/usr/lib/postgresql/*/bin/initdb" > /dev/null \
            && compgen -G "/usr/lib/postgresql/*/bin/pg_ctl" > /dev/null \
            && compgen -G "/usr/lib/postgresql/*/bin/psql" > /dev/null; then
            echo "Using the PostgreSQL server already on the runner image:"
            ls -d /usr/lib/postgresql/*/bin
          else
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y postgresql
          fi
          "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)/initdb" --version

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: PostgreSQL regression tests must not silently skip or todo in CI
        # PostgreSQL is installed in the step above, so these tests must
        # actually execute here — an all-skipped result means CI itself is
        # misconfigured (e.g. the install step above silently failed, or a
        # future runner image drops the postgres package), not a legitimate
        # "unavailable" environment. Separately from this, a genuinely
        # broken migration under test still fails these tests outright
        # (not a skip) — see business_hours_interval_validation.pg.test.ts's
        # own skip-vs-fail handling and its harness self-test. A nonzero
        # `todo` count is treated the same way: these files have no
        # legitimate reason to mark a real-PostgreSQL regression as todo
        # (the one case that briefly did — a concurrent-idempotency race —
        # was fixed by 20261010120000, not left as a permanent todo), so a
        # todo appearing here means a future change quietly downgraded a
        # real failure instead of fixing it.
        run: |
          set -eo pipefail
          # Every real-PostgreSQL file, by glob: a hand-kept list had silently
          # left 18 of 35 files (all migrations since 2026-11-20) unguarded.
          node --experimental-strip-types --test --test-reporter=tap supabase/migrations/*.pg.test.ts \
            2>&1 | tee pg-test-output.log
          # Every skip fails CI except the real-PostgREST checks of the WhatsApp
          # files, which need a PostgREST binary (POSTGREST_BIN) this job does not install.
          skipped=$(grep -E '# SKIP' pg-test-output.log | grep -vc 'POSTGREST_BIN' || true)
          todo=$(grep -oP '(?<=^# todo )\d+' pg-test-output.log | tail -1)
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::error::${skipped} PostgreSQL regression test(s) were skipped in CI. PostgreSQL is installed in this job, so a skip here means CI is misconfigured, not that the environment genuinely lacks PostgreSQL — failing rather than passing silently with no real database coverage."
            exit 1
          fi
          if [ "${todo:-0}" -gt 0 ]; then
            echo "::error::${todo} PostgreSQL regression test(s) reported todo. These real-database regression tests have no legitimate reason to use todo as a way to keep CI green — failing so a real issue can't be silently downgraded."
            exit 1
          fi

      - name: Full test suite
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder-ci-build-key"
        run: npm run build
