name: Voice agent

on:
  push:
    paths:
      [
        "services/voice-agent/**",
        "src/lib/voice-agent/**",
        "src/lib/voice-intent-lexicon.ts",
        "src/lib/voice-languages.ts",
        ".github/workflows/voice-agent.yml",
      ]
  pull_request:
    paths:
      [
        "services/voice-agent/**",
        "src/lib/voice-agent/**",
        "src/lib/voice-intent-lexicon.ts",
        "src/lib/voice-languages.ts",
        ".github/workflows/voice-agent.yml",
      ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/voice-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
